spring.application.name=clinicflow-backend
server.port=${PORT:8080}

# Database profile fallback: If SPRING_DATASOURCE_URL is supplied (e.g., Supabase PostgreSQL),
# it uses PostgreSQL. Otherwise, it gracefully boots into an embedded H2 database for effortless zero-config testing.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:clinicflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console (available during local development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Security
clinicflow.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B59703645}
clinicflow.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# CORS
clinicflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
